# Caller example: copy to .github/workflows/credential-expiry.yml in an app that publishes to the
# Microsoft Store. Set the date whenever the Store secret is created or rotated:
#   gh variable set STORE_SECRET_EXPIRES --org Dynamic-Solutions-Canada --body YYYY-MM-DD
name: Credential Expiry

on:
  schedule:
    # Mondays at 13:00 UTC (9 a.m. Toronto in EDT, 8 a.m. in EST).
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-expiry
  cancel-in-progress: true

jobs:
  check:
    uses: Dynamic-Solutions-Canada/winui-app-kit/.github/workflows/credential-expiry.yml@v1.17.0
    with:
      expires: ${{ vars.STORE_SECRET_EXPIRES }}
