name: Credential Expiry

# Reusable warning before the Entra client secret behind Store publishing expires (CI-11). Called by
# an app's own credential-expiry.yml on a schedule; see "Publishing to the Microsoft Store" in the kit
# README for the caller.
#
# Entra client secrets last 24 months at most. Without this, the reminder that the secret lapsed is a
# failed Store submission on release day, with an authentication error that names nothing useful.
#
# No API call answers "when does my own secret expire?": reading an app registration's
# passwordCredentials needs Graph permissions the Store credential does not have and should not be
# given. So the date is kept in the STORE_SECRET_EXPIRES variable (an expiry date is not sensitive),
# set whenever AZURE_AD_APPLICATION_SECRET is created or rotated, and the caller passes it in.
#
# This deliberately does not open an issue. A failed scheduled run already emails the repo owner, and
# an issue announcing when the publishing credential lapses would be public information.

on:
  workflow_call:
    inputs:
      expires:
        description: 'The secret expiry date, YYYY-MM-DD: pass the STORE_SECRET_EXPIRES variable'
        type: string
        required: true
      warn_days:
        description: 'Start failing this many days before expiry: long enough to schedule a rotation'
        type: number
        default: 60

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Store credential's expiry
        env:
          EXPIRES: ${{ inputs.expires }}
          WARN_DAYS: ${{ inputs.warn_days }}
        run: |
          set -euo pipefail

          if [ -z "${EXPIRES}" ]; then
            echo "::error::STORE_SECRET_EXPIRES is not set, so nothing is watching the Store credential."
            echo "Set it with: gh variable set STORE_SECRET_EXPIRES --body YYYY-MM-DD"
            exit 1
          fi

          # Reject a malformed date rather than letting `date` coerce it into something wrong.
          if ! printf '%s' "${EXPIRES}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::STORE_SECRET_EXPIRES is '${EXPIRES}', expected YYYY-MM-DD."
            exit 1
          fi

          expires_at=$(date -u -d "${EXPIRES}" +%s)
          now=$(date -u +%s)
          days=$(( (expires_at - now) / 86400 ))

          {
            echo "## Microsoft Store credential"
            echo
            echo "\`AZURE_AD_APPLICATION_SECRET\` expires **${EXPIRES}** (${days} days)."
            echo
            echo "Rotate it in Entra (App registrations, the Store app, Certificates & secrets),"
            echo "update the secret, then run: gh variable set STORE_SECRET_EXPIRES --body YYYY-MM-DD"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${days}" -lt 0 ]; then
            echo "::error::The Store credential expired ${EXPIRES} ($(( -days )) days ago). Store publishing cannot authenticate."
            exit 1
          fi

          if [ "${days}" -le "${WARN_DAYS}" ]; then
            echo "::error::The Store credential expires in ${days} days (${EXPIRES}). Rotate it."
            exit 1
          fi

          echo "Store credential expires ${EXPIRES}, ${days} days away; nothing to do."
