name: Store Publish Dry Run

# Proves the reusable Store publishing workflow end to end without touching the Store: it packages the
# kit's compile check (Xaml/CompileCheck, with its MSIX fixture) for both architectures, bundles them
# into a Store upload, and stops before any Store call. Runs when the publishing path changes.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/store-publish.yml'
      - '.github/workflows/store-publish-dry-run.yml'
      - 'scripts/store/**'
      - 'tests/store/fixtures/store-assets/**'
      - 'build/build-msix.ps1'
      - 'Xaml/CompileCheck/**'
  pull_request:
    paths:
      - '.github/workflows/store-publish.yml'
      - '.github/workflows/store-publish-dry-run.yml'
      - 'scripts/store/**'
      - 'tests/store/fixtures/store-assets/**'
      - 'build/build-msix.ps1'
      - 'Xaml/CompileCheck/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    uses: ./.github/workflows/store-publish.yml
    with:
      store_product_id: 9TESTAPP0001
      kit_path: '.'
      notes_dir: release-notes
      dry_run: true
      # Proves the screenshots path up to the Store call: every locale planned from a fixture store-assets
      # (a per-locale hero and a shared screenshot), and the package and images archived together.
      screenshots: true
      store_assets: tests/store/fixtures/store-assets
      # Proves the build secret path: a fixture value (not a secret) must reach pre_build and packaging.
      build_secret_env_name: KitDryRunBuildSecret
      pre_build: |
        if ($env:KitDryRunBuildSecret -ne 'dry-run-fixture-not-a-secret') { throw 'BUILD_SECRET did not reach pre_build as KitDryRunBuildSecret.' }
        Write-Output 'BUILD_SECRET reached pre_build as KitDryRunBuildSecret.'
    secrets:
      BUILD_SECRET: dry-run-fixture-not-a-secret
