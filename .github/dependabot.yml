version: 2

updates:
  - package-ecosystem: nuget
    # The library and the portable harnesses, not "/": Xaml/CompileCheck is a WinUI MSIX app project
    # that Dependabot's Linux runner is not asked to evaluate. Every listed project imports
    # build/WinUIAppKit.Packages.props, where the versions are updated.
    directories:
      - "/WinUIAppKit"
      - "/tests/WinUIAppKit.Settings.Tests"
      - "/tests/WinUIAppKit.Startup.Tests"
      - "/tests/WinUIAppKit.Updates.Tests"
      - "/tests/WinUIAppKit.Localization.Tests"
    schedule:
      interval: weekly
    # A refresh of an open PR runs only in the folder of the file it changed (/build), which holds no
    # project, so Dependabot finds nothing and closes the PR as "no longer updatable" (job logs of PR 1
    # and PR 5). Automatic rebases are off so a PR stays open while main moves. A change to this file
    # or "@dependabot recreate" still refreshes, and closes, it: take such an update by hand.
    rebase-strategy: disabled
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # The kit stays on Windows App SDK 2.x while every consuming app's manifest depends on the
      # Microsoft.WindowsAppRuntime.2 framework; 2.x minors update that framework in place, 3.0 needs
      # each app's manifest changed.
      - dependency-name: Microsoft.WindowsAppSDK
        update-types: ["version-update:semver-major"]
      # Held on the .NET 10 line with the rest of the family; 11.x belongs to the next .NET major
      # (see build/WinUIAppKit.Packages.props).
      - dependency-name: System.Security.Cryptography.ProtectedData
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    # The devkit tools scripts/devkit installs for the Windows apps.
    directory: "/tools/devkit"
    schedule:
      interval: weekly
    ignore:
      # The icon check compares rendered bytes, so the renderer moves only by hand, with every app's
      # icons regenerated in the same change.
      - dependency-name: "@resvg/resvg-js"
      # devkit is pinned to a release tag and bumped by hand, following the consumer steps in its
      # release notes. Dependabot misreads its git tags (it proposed v0.20.3 -> v0.17.1).
      - dependency-name: "@dynamic-solutions-canada/devkit"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
